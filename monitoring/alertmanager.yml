# ============================================
# Saraya ERP - Alertmanager Configuration
# ============================================

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - matchers:
        - severity="critical"
      receiver: 'critical'
      repeat_interval: 15m
    - matchers:
        - severity="warning"
      receiver: 'default'

receivers:
  - name: 'default'
    # Production: configure local SMTP relay or internal webhook receiver
    # webhook_configs:
    #   - url: 'http://oncall-relay.internal:9095/alerts'
    #     send_resolved: true

  - name: 'critical'
    # Production: configure urgent SMS/pager/Telegram relay or SMTP alerts
    # email_configs:
    #   - to: 'ops-oncall@hospital.ly'
    #     from: 'saraya-alerts@hospital.ly'
    #     smarthost: 'smtp.internal:587'

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['alertname']
