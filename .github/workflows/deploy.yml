name: Build and Publish Docker Images

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # 1. اختبارات الجودة (Quality Checks)
  # ==========================================
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: saraya_ci_test
          POSTGRES_USER: saraya_test
          POSTGRES_PASSWORD: synthetic_ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saraya_test -d saraya_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Verify i18n keys are balanced
        run: node scripts/check-i18n.js

      - name: Verify controller security declarations
        run: node scripts/verify-tenant-isolation.js

      - name: Verify every controller route permission declaration
        run: node generate-audit-report.cjs --check

      - name: Verify safe migration startup
        run: bash tests/entrypoint-migrations.test.sh

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Generate and validate Prisma schema
        working-directory: ./server
        run: |
          npx prisma generate
          npx prisma validate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Lint server
        working-directory: ./server
        run: npm run lint:ci

      - name: Test lint regression gate
        working-directory: ./server
        run: node --test scripts/check-lint-baseline.test.cjs

      - name: Build server
        working-directory: ./server
        run: |
          npm run typecheck
          npm run build

      - name: Test database reset safety
        working-directory: ./server
        run: npm run test:helpers

      - name: Run server tests
        working-directory: ./server
        run: npm test -- --runInBand
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          JWT_SECRET: "test-secret-key-for-ci"
          NODE_ENV: test

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Verify fresh migrations and real database workflows
        working-directory: ./server
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://saraya_test:synthetic_ci_test_only@127.0.0.1:5432/saraya_ci_test?schema=public
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          REDIS_PASSWORD: ''
          REDIS_MOCK: 'false'
          JWT_SECRET: synthetic_isolated_ci_jwt_key_for_test_only
          ENCRYPTION_KEY: synthetic_isolated_ci_encryption_key_for_test_only
          ENCRYPTION_SALT: synthetic_isolated_ci_salt
          DISABLE_THROTTLER: 'true'
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
          npm run test:e2e -- --runInBand

      - name: Build client (type check)
        working-directory: ./client
        run: npm run build
        env:
          VITE_API_URL: /api

      - name: Run client tests
        working-directory: ./client
        run: npm test -- --run --maxWorkers=2

      - name: Lint client
        working-directory: ./client
        run: npm run lint

  # ==========================================
  # 2. بناء ونشر الصور (Build & Push)
  # ==========================================
  build-and-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - context: ./client
            image: saraya-frontend
            dockerfile: Dockerfile
          - context: ./server
            image: saraya-backend
            dockerfile: Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            VITE_API_URL=/api
