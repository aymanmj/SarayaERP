# ============================================
# Saraya ERP - Ubuntu VM Production Demo Nginx Config
# Designed to sit behind Cloudflare Tunnel (TLS terminated at Cloudflare Edge)
# Origin URL in Cloudflare Zero Trust: http://saraya_nginx:80
# ============================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 4096;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout  65;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    types_hash_max_size 2048;

    # Allow DICOM / PDF / Pre-Auth attachment uploads up to 50MB
    client_max_body_size 50M;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time';

    map $uri $log_request_uri {
        default 1;
        ~*^/api/radiology/viewer/ 0;
    }
    map $uri $saraya_referrer_policy {
        default no-referrer-when-downgrade;
        ~*^/api/radiology/viewer/ no-referrer;
    }
    access_log  /var/log/nginx/access.log  main if=$log_request_uri;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    large_client_header_buffers 4 64k;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

    geo $is_lan {
        default         0;
        127.0.0.0/8     1;
        10.0.0.0/8      1;
        172.16.0.0/12   1;
        192.168.0.0/16  1;
    }

    upstream backend_upstream {
        zone backend_upstream 64k;
        server backend:3000;
        keepalive 64;
    }

    map $cookie_Authentication $socket_affinity {
        ""      $remote_addr;
        default $cookie_Authentication;
    }

    map "$arg_transport:$arg_sid" $socket_backend {
        default           backend_upstream;
        ~^polling:        socket_affinity_upstream;
        ~^websocket:.+    socket_affinity_upstream;
    }

    upstream socket_affinity_upstream {
        zone socket_affinity_upstream 64k;
        hash $socket_affinity consistent;
        server backend:3000;
    }

    upstream frontend_upstream {
        server frontend:80;
        keepalive 64;
    }

    # Preserve Cloudflare's HTTPS scheme header so NestJS trust-proxy recognizes HTTPS
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy $saraya_referrer_policy always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;

        # Restrict detailed health & metrics to internal ranges only
        location /api/health/detailed {
            allow 127.0.0.1;
            allow ::1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://backend_upstream;
            access_log off;
        }

        location /api/health/metrics {
            allow 127.0.0.1;
            allow ::1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://backend_upstream;
            access_log off;
        }

        location /api/health {
            proxy_pass http://backend_upstream;
            access_log off;
        }

        # Block public ZKTeco ADMS push endpoint from Internet
        location ^~ /iclock/ {
            if ($is_lan = 0) {
                return 403;
            }
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Frontend SPA
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Auth login rate-limit
        location /api/auth/login {
            limit_req zone=login_limit burst=10 nodelay;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location ^~ /api/radiology/viewer/ {
            limit_req zone=api_limit burst=100 nodelay;
            limit_req_status 429;
            limit_req_log_level info;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;
            limit_req_status 429;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Realtime Socket.IO
        location /socket.io/ {
            proxy_pass http://$socket_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # Static asset caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend_upstream;
            expires 1y;
            access_log off;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy $saraya_referrer_policy always;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
