# ============================================
# Saraya Medical ERP — Local DNS Configuration
# ============================================
# يضمن عمل النطاق بدون إنترنت داخل شبكة المستشفى
# يتم استبدال SARAYA_DOMAIN و SARAYA_SERVER_IP أثناء التثبيت

# ترجمة نطاق السرايا إلى IP السيرفر المحلي
# هذا هو السطر الذي يجعل النظام يعمل بدون إنترنت
address=/SARAYA_DOMAIN/SARAYA_SERVER_IP

# Forward باقي الطلبات لـ DNS خارجي عندما يكون الإنترنت متاحاً
server=1.1.1.1
server=8.8.8.8

# لا تستخدم /etc/resolv.conf الخاص بالحاوية
no-resolv

# Cache DNS responses — يسرّع الاستعلامات المتكررة
cache-size=1000

# سجل الاستعلامات (للتشخيص — يمكن تعطيله في الإنتاج)
# log-queries

# لا تستمع على الشبكات الخارجية
listen-address=0.0.0.0

# معالجة النطاقات غير الموجودة — لا تعيد NXDOMAIN بل أعد IP السيرفر
# هذا يمنع أخطاء DNS عند انقطاع الإنترنت لأي نطاق فرعي
local=/alsarayatech.ly/
